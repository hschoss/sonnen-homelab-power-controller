[project]
name = "sonnen-homelab-power-controller"
version = "0.1.0"
description = "Low-level sonnenBatterie collector and homelab power decision engine"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "kubernetes>=30.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sonnen_power"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
